<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100d0a"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0954f"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c8cd6"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- faint grid, decorative only -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
  </g>

  <!-- header -->
  <text x="60" y="62" fill="#f3f1ea" font-size="30" font-weight="700">AI Grading Engine</text>
  <text x="60" y="92" fill="#9aa3ab" font-size="17" font-weight="400">Fail-closed LLM exam evaluation &#8212; pipeline architecture</text>
  <rect x="60" y="106" width="120" height="4" fill="#e0954f"/>

  <!-- ===== main flow row ===== -->
  <!-- Stage 1: Exam Input -->
  <g>
    <rect x="60" y="230" width="190" height="120" rx="10" fill="#14110c" stroke="#3a3f47" stroke-width="1.5"/>
    <rect x="60" y="230" width="190" height="6" rx="3" fill="#7ea0c9"/>
    <text x="155" y="278" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Exam Input</text>
    <text x="155" y="302" fill="#9aa3ab" font-size="13" text-anchor="middle">Student answer +</text>
    <text x="155" y="320" fill="#9aa3ab" font-size="13" text-anchor="middle">question context</text>
  </g>

  <line x1="250" y1="290" x2="298" y2="290" stroke="#e0954f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Structured Output -->
  <g>
    <rect x="300" y="230" width="190" height="120" rx="10" fill="#14110c" stroke="#3a3f47" stroke-width="1.5"/>
    <rect x="300" y="230" width="190" height="6" rx="3" fill="#c9d6d6"/>
    <text x="395" y="270" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Structured</text>
    <text x="395" y="292" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Output</text>
    <text x="395" y="320" fill="#9aa3ab" font-size="13" text-anchor="middle">OpenAI &#183; canonical schema</text>
  </g>

  <line x1="490" y1="290" x2="538" y2="290" stroke="#e0954f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Validation Boundary -->
  <g>
    <rect x="540" y="230" width="190" height="120" rx="10" fill="#14110c" stroke="#3178c6" stroke-width="1.5"/>
    <rect x="540" y="230" width="190" height="6" rx="3" fill="#3178c6"/>
    <text x="635" y="270" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Validation</text>
    <text x="635" y="292" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Boundary</text>
    <text x="635" y="320" fill="#9aa3ab" font-size="13" text-anchor="middle">Zod-checked schema</text>
  </g>

  <line x1="730" y1="290" x2="778" y2="290" stroke="#e0954f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Course Rubric Rules -->
  <g>
    <rect x="780" y="230" width="190" height="120" rx="10" fill="#14110c" stroke="#3a3f47" stroke-width="1.5"/>
    <rect x="780" y="230" width="190" height="6" rx="3" fill="#7fae94"/>
    <text x="875" y="270" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Course Rubric</text>
    <text x="875" y="292" fill="#f3f1ea" font-size="19" font-weight="700" text-anchor="middle">Rules</text>
    <text x="875" y="320" fill="#9aa3ab" font-size="13" text-anchor="middle">20+ courses, per-course logic</text>
  </g>

  <line x1="970" y1="290" x2="1013" y2="290" stroke="#e0954f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Fail-closed gate (diamond) -->
  <g>
    <polygon points="1075,232 1145,290 1075,348 1005,290" fill="#1a130c" stroke="#e0954f" stroke-width="2"/>
    <text x="1075" y="284" fill="#f2b273" font-size="14" font-weight="700" text-anchor="middle">Fail-Closed</text>
    <text x="1075" y="302" fill="#f2b273" font-size="14" font-weight="700" text-anchor="middle">Gate</text>
  </g>

  <!-- Gate -> Final result -->
  <line x1="1075" y1="348" x2="1075" y2="420" stroke="#e0954f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1090" y="390" fill="#7fae94" font-size="13" font-weight="600">verified</text>

  <!-- Final result box -->
  <g>
    <rect x="920" y="424" width="310" height="96" rx="10" fill="#14110c" stroke="#f2b273" stroke-width="1.5"/>
    <rect x="920" y="424" width="310" height="6" rx="3" fill="#f2b273"/>
    <text x="1075" y="462" fill="#f3f1ea" font-size="18" font-weight="700" text-anchor="middle">Grade + Feedback</text>
    <text x="1075" y="486" fill="#9aa3ab" font-size="13" text-anchor="middle">Only reaches a real record after every gate passes</text>
  </g>

  <!-- Gate -> no grade (rejection path) -->
  <line x1="1045" y1="318" x2="960" y2="470" stroke="#8a7f78" stroke-width="1.75" stroke-dasharray="5,5" marker-end="url(#arrowMuted)"/>
  <g>
    <rect x="700" y="450" width="200" height="70" rx="8" fill="#14110c" stroke="#5a5048" stroke-width="1.25" stroke-dasharray="4,4"/>
    <text x="800" y="480" fill="#c9c4bc" font-size="14" font-weight="700" text-anchor="middle">No Grade Issued</text>
    <text x="800" y="500" fill="#8a8078" font-size="12" text-anchor="middle">Never fabricates a score</text>
  </g>

  <!-- Shadow-mode calibration (feeds the gate) -->
  <g>
    <rect x="540" y="560" width="360" height="110" rx="10" fill="#14110c" stroke="#9c8cd6" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="540" y="560" width="10" height="110" rx="4" fill="#9c8cd6"/>
    <text x="720" y="598" fill="#f3f1ea" font-size="18" font-weight="700" text-anchor="middle">Shadow-Mode Calibration</text>
    <text x="720" y="622" fill="#9aa3ab" font-size="13" text-anchor="middle">New grading logic runs in an isolated store</text>
    <text x="720" y="642" fill="#9aa3ab" font-size="13" text-anchor="middle">until it's proven &#8212; before it can touch a real grade</text>
  </g>

  <path d="M 900 590 L 1010 590 L 1010 348" fill="none" stroke="#9c8cd6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowMuted)"/>
  <text x="925" y="580" fill="#b6a8e8" font-size="12" font-weight="600">promotes to gate</text>

  <line x1="635" y1="350" x2="635" y2="560" stroke="#9c8cd6" stroke-width="1.75" stroke-dasharray="6,4"/>
  <text x="648" y="460" fill="#b6a8e8" font-size="12" font-weight="600">candidate logic</text>

  <!-- footer proof strip -->
  <g font-size="13" font-weight="600">
    <rect x="60" y="686" width="150" height="34" rx="17" fill="none" stroke="#7fae94" stroke-width="1.25"/>
    <text x="135" y="707" fill="#7fae94" text-anchor="middle">20+ courses live</text>

    <rect x="222" y="686" width="200" height="34" rx="17" fill="none" stroke="#3178c6" stroke-width="1.25"/>
    <text x="322" y="707" fill="#6ea3e0" text-anchor="middle">Zod-validated boundaries</text>

    <rect x="434" y="686" width="230" height="34" rx="17" fill="none" stroke="#e0954f" stroke-width="1.25"/>
    <text x="549" y="707" fill="#f2b273" text-anchor="middle">Never fabricates a score</text>
  </g>
</svg>
